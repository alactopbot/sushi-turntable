<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf5e9" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="description" content="交换旁边的寿司，连成三个就消掉。掉下来的还能再连哦。" />
  <title>转转寿司</title>
</head>
<body>
  <main>
    <header><span class="eyebrow">小小厨房 · 连连好滋味</span><h1>转转寿司</h1>
      <p class="tagline">交换旁边的寿司，连成三个就消掉。掉下来的还能再连哦。</p>
    </header>
    <section class="game" aria-label="转转寿司游戏">
      <div class="hud">
        <div><span>关卡</span><strong id="level">1</strong></div>
        <div class="score"><span>当前分 / 目标分</span><div><strong id="score">0</strong> / <span id="target">800</span></div></div>
        <div><span>剩余步数</span><strong id="moves">30</strong></div>
      </div>
      <progress id="progress" value="0" max="800" aria-label="目标分进度"></progress>
      <div class="board-wrap">
        <div id="board" aria-label="8×8 寿司棋盘"></div>
        <div id="float-score" aria-hidden="true"></div>
        <div id="result" class="result" hidden role="dialog" aria-modal="true" aria-labelledby="result-title">
          <div class="result-card"><span class="result-icon" aria-hidden="true">✦</span><h2 id="result-title"></h2><p id="result-copy"></p>
            <button id="next" type="button">下一关</button><button id="restart" type="button">再试一次</button>
          </div>
        </div>
      </div>
      <p id="hint" role="status" aria-live="polite">点一块寿司，再点它上下左右的伙伴</p>
      <div class="game-foot"><span id="types">8×8 · 4 种寿司</span><button id="retry" class="quiet" type="button">重开本关</button></div>
    </section>
    <footer>三连 60 分 · 四连 120 分 · 五连 180 分<br />连锁得分 ×2、×3… · 无效交换不扣步<br />达到目标就过关，步数用尽且未达目标则结束。</footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
