<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf5e9" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="description" content="从流水线点到盘子里，连成三个就消掉。盘子不能换顺序哦。" />
  <title>转转寿司</title>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">小小厨房 · 美味开张</span>
      <h1>转转寿司</h1>
      <p>从流水线点到盘子里，连成三个就消掉。盘子不能换顺序哦。</p>
    </header>
    <section class="game" aria-label="转转寿司游戏">
      <div class="hud">
        <div class="level"><span>关卡</span><strong id="level">1</strong></div>
        <div class="score">
          <div><span id="level-name">第一份美味</span><span><strong id="score">0</strong> / <span id="target">180</span> 分</span></div>
          <progress id="progress" value="0" max="180" aria-label="目标分进度"></progress>
          <div><span id="capacity">8 格 · 3 种寿司</span><button id="retry" class="quiet" type="button">重开本关</button></div>
        </div>
      </div>
      <div class="board">
        <canvas id="board" aria-label="弯道流水线，点任意寿司放入下方盘尾，盘内不能重排">请使用支持 Canvas 的浏览器。</canvas>
        <div id="result" class="result" hidden role="dialog" aria-modal="true" aria-labelledby="result-title">
          <div class="result-card">
            <h2 id="result-title"></h2><p id="result-copy"></p>
            <button id="next" type="button">下一关</button>
            <button id="restart" type="button">再试一次</button>
          </div>
        </div>
      </div>
      <p id="hint" class="hint" role="status" aria-live="polite">点线上任意寿司，放到盘尾 →</p>
      <div class="instructions"><span>① 点线取餐</span><span>② 入盘尾</span><span>③ 连三消掉</span></div>
    </section>
    <footer>三连 60 分 · 四连 120 分 · 五连 180 分<br />达到目标分过关，盘满且不能消除就结束。</footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
